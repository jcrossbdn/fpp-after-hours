# Installed by the fpp-after-hours plugin as
# /etc/systemd/system/mpd.service.d/fpp-after-hours.conf and removed on
# uninstall.

[Unit]
# Ordering only. Pulling the bridge in would also pull in FPP's PipeWire
# (the bridge BindsTo it), and FPP starts that on demand from fppinit. The
# bridge restarts MPD itself once its socket is listening.
After=fpp-after-hours-pulse.service

[Service]
User=fpp
Group=fpp
SupplementaryGroups=audio
Environment="PULSE_SERVER=unix:/run/fpp-after-hours/pulse-native"
# /run/mpd owned by fpp while this drop-in is in place, instead of overriding
# the package's tmpfiles rule system-wide. Preserve it across restarts because
# mpd.socket may keep its listening socket in there.
RuntimeDirectory=mpd
RuntimeDirectoryMode=0755
RuntimeDirectoryPreserve=yes
